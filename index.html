function records(){
 const videos = new Map();
 const unmatched = new Map();
 for (const entry of [...historical(), ...Object.values(fresh).flat()]) {
   const url = replayUrl(entry.url) || replayData.byStart[entry.name+'|'+entry.start];
   if (!url) {
     const minute = Math.floor(date(entry.start) / 60000);
     unmatched.set(entry.name+'|'+minute, entry);
     continue;
   }
   const older = videos.get(url);
   const startRecord = older && !older.published ? older : entry;
   videos.set(url, {...older, ...entry, url, start: startRecord.start, published: !!startRecord.published,
     thumbnailImageUrl: entry.thumbnailImageUrl || older?.thumbnailImageUrl});
 }
 const leftovers = [];
 const candidates = new Map();
 for (const entry of unmatched.values()) {
   const matches = [...videos.values()].filter(video => {
     if (video.name !== entry.name) return false;
     const minutesApart = (date(video.start) - date(entry.start)) / 60000;
     if (!video.published) return Math.abs(minutesApart) < 1;
     if (!Number.isFinite(entry.minutes) || !Number.isFinite(video.minutes)) return false;
     const delay = minutesApart - entry.minutes;
     return Math.abs(entry.minutes-video.minutes) <= 1 && delay >= -1 && delay <= 45;
   });
   if (matches.length !== 1) { leftovers.push(entry); continue; }
   const url = matches[0].url;
   if (!candidates.has(url)) candidates.set(url, []);
   candidates.get(url).push(entry);
 }
 for (const [url, entries] of candidates) {
   if (entries.length > 1) { leftovers.push(...entries); continue; }
   const video = videos.get(url);
   if (video.published) videos.set(url, {...video, start: entries[0].start, published: false});
 }
 return [...videos.values(), ...leftovers].sort((a,b) => date(b.start) - date(a.start));
}
